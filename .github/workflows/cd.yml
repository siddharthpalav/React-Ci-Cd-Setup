name: "CD Pipeline"

on:
  workflow_run:
    workflows: ["Sample React CI Pipeline / Workflow"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: "Clone the repository"
        uses: actions/checkout@v4

      - name: "Setup nodejs"
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: "Setup vercel cli"
        run: npm install -g vercel

      - name: "Download build files"
        uses: actions/download-artifact@v4
        with:
          name: build
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ github.token }}
          path: dist

      # CHANGES ARE IN THIS STEP BELOW
      - name: "Deploy to vercel"
        run: |
          # 1. Force create a local configuration linking this directory to your lowercase project name
          mkdir -p .vercel
          echo '{"projectId":"prj_dummy","orgId":"team_dummy","projectName":"reactcicd"}' > .vercel/project.json

          # 2. Pull settings down (The --project flag tells it which project to overwrite with)
          vercel pull --yes --environment=production --project=reactcicd --token=${{ secrets.VERCEL_TOKEN }}

          # 3. Inform Vercel to register your 'dist' build directory locally 
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

          # 4. Deploy the prebuilt directory straight to the web
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
